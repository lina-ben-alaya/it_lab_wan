const THEMES={mpls:{n:"Cœur de réseau MPLS",d:"Le backbone de l'opérateur, puis le VPN vendu au client."},rout:{n:"Routage entre domaines",d:"Échanger des routes entre systèmes autonomes et entre protocoles."},serv:{n:"Services IP",d:"Attribuer les adresses et traduire les adresses privées."},vpn:{n:"VPN chiffrés",d:"Relier deux sites à travers un réseau public."},fr:{n:"Frame Relay",d:"Circuits virtuels permanents, DLCI et topologie en étoile."}};
const TPS=[
{id:"tp1a",code:"TP1 partie 1",t:"Backbone MPLS : OSPF et EIGRP",th:"mpls",tool:"GNS3 · Cisco 7200",dur:40,
obj:["Monter la maquette SP1–SP2–SP3 et les sites SIEGE et AGENCE","Configurer OSPF zone 0 dans le réseau de l'opérateur","Configurer EIGRP AS 100 dans le réseau du client"],
topo:["Backbone : SP1 (lo 1.1.1.1/25), SP2 (lo 2.2.2.2/25), SP3 (lo 3.3.3.3/25)","Liaisons opérateur : SP1–SP2 192.168.23.0/24, SP2–SP3 192.168.34.0/24","Liaisons PE–CE : SP1–SIEGE 192.168.12.0/24, SP3–AGENCE 192.168.45.0/24","LAN SIEGE 10.10.10.0/24, LAN AGENCE 192.168.1.0/24"],
no:[["Backbone MPLS","Cœur du réseau de l'opérateur, ici une zone OSPF unique."],["CE (Customer Edge)","Routeur du client raccordé à l'opérateur : SIEGE et AGENCE."],["Interface de bouclage","Interface virtuelle ; son adresse sert de router-ID OSPF."],["ip ospf network point-to-point","Fait annoncer à OSPF le vrai masque de la loopback au lieu d'un /32, ce qui pose problème avec MPLS."]],
st:[["SP1(config)#","interface loopback 0","Créer l'interface de bouclage de SP1."],["SP1(config-if)#","ip address 1.1.1.1 255.255.255.128","Adresse en /25, comme sur le schéma."],["SP1(config-if)#","ip ospf network point-to-point","OSPF annoncera 1.1.1.0/25 et non un /32."],["SP1(config)#","router ospf 1","Démarrer OSPF chez l'opérateur (numéro de processus au choix)."],["SP1(config-router)#","network 1.1.1.0 0.0.0.127 area 0","Annoncer la loopback dans la zone 0."],["SP1(config-router)#","network 192.168.23.0 0.0.0.255 area 0","Annoncer la liaison vers SP2."],["SIEGE(config)#","router eigrp 100","EIGRP dans l'AS 100 du client."],["SIEGE(config-router)#","network 10.10.10.0 0.0.0.255","Annoncer le LAN SIEGE."]],
qz:[["Quel protocole de routage utilise le backbone de l'opérateur ?",["RIP version 2","OSPF, zone unique","EIGRP AS 100","BGP"],1,"L'énoncé précise que le backbone MPLS est un réseau à zone OSPF unique (area 0)."],["Sans « ip ospf network point-to-point », avec quelle longueur de préfixe OSPF annonce-t-il une loopback ?",["/24","/25","/30","/32"],3,"Par défaut OSPF annonce l'adresse d'une loopback en /32, ce qui cause des problèmes dans les environnements MPLS."],["Comment appelle-t-on les routeurs SIEGE et AGENCE ?",["Routeurs P","Routeurs PE","Routeurs CE","Routeurs ABR"],2,"Ce sont les routeurs du client : Customer Edge."],["Pourquoi SIEGE et AGENCE ne deviennent-ils pas encore voisins EIGRP ?",["EIGRP est mal configuré","MPLS n'est pas encore en place sur SP1 et SP3","Les AS sont différents","OSPF bloque EIGRP"],1,"Les voisins ne seront détectés qu'une fois MPLS (et le VPN) en place : c'est l'objet des TP suivants."]]},
{id:"tp1b",code:"TP1 partie 2",t:"Activation de MPLS et LDP",th:"mpls",tool:"GNS3",dur:30,sim:"labels",
obj:["Forcer le router-ID LDP sur la loopback 0","Activer MPLS sur les interfaces du backbone","Lire la LIB et la LFIB"],
topo:["Même maquette que la partie 1","Domaine MPLS : interfaces physiques entre SP1, SP2 et SP3"],
no:[["LDP","Label Distribution Protocol : les routeurs MPLS s'échangent les labels associés aux préfixes."],["LIB","Table de tous les labels appris, affichée par « show mpls ldp bindings »."],["LFIB","Table de commutation de labels réellement utilisée, affichée par « show mpls forwarding-table »."],["Router-ID LDP","Identifiant du routeur dans LDP ; le forcer sur la loopback le rend stable."]],
st:[["SP1(config)#","mpls ldp router-id loopback0 force","La loopback 0 devient le router-ID LDP, quoi qu'il arrive."],["SP1(config)#","interface s1/2","Interface vers SP2, dans le domaine MPLS."],["SP1(config-if)#","mpls ip","Activer MPLS : un message d'adjacence LDP apparaît."],["SP3#","show mpls ldp neighbor","Vérifier les adjacences LDP."],["SP3#","show mpls interfaces","Lister les interfaces qui fonctionnent avec MPLS."],["SP3#","show mpls forwarding-table","Afficher la LFIB."],["SP3#","show mpls ldp bindings","Afficher la LIB."]],
qz:[["Quelle commande affiche la LFIB ?",["show mpls ldp bindings","show mpls forwarding-table","show mpls interfaces","show ip route"],1,"La LFIB est la table de commutation de labels."],["Quelle commande affiche la LIB ?",["show mpls ldp bindings","show mpls ldp neighbor","show mpls forwarding-table","show ip ospf"],0,"La LIB contient toutes les associations préfixe–label."],["Pourquoi forcer le router-ID LDP sur la loopback 0 ?",["Pour chiffrer LDP","Pour que sa valeur reste inchangée après un changement de topologie ou un redémarrage","Pour désactiver OSPF","Pour accélérer les pings"],1,"La loopback serait choisie automatiquement, mais la forcer garantit un identifiant stable."],["Quelle commande active MPLS sur une interface ?",["mpls enable","ip mpls","mpls ip","label switching"],2,"« mpls ip » en mode configuration d'interface."]]},
{id:"tp2",code:"TP2",t:"VPN MPLS pour un client",th:"mpls",tool:"GNS3 · Wireshark",dur:60,sim:"labels",
obj:["Créer la VRF du Client A sur les PE","Router entre PE et CE avec EIGRP par VRF","Échanger les routes VPNv4 avec MP-BGP","Observer l'empilement de labels"],
topo:["PE : SP1 et SP3 ; CE : SIEGE et AGENCE","VRF Client_A : RD 100:1, RT 1:100","Opérateur : AS 1 ; client : EIGRP AS 100"],
no:[["VRF","Table de routage séparée, propre à un client, sur un routeur PE."],["RD (Route Distinguisher)","Identifiant ajouté aux routes du client pour les rendre uniques : ici 100:1."],["RT (Route Target)","Attribut qui décide quelles routes VPNv4 sont importées ou exportées par une VRF : ici 1:100."],["MP-BGP VPNv4","Extension de BGP qui transporte les routes des VRF entre les PE."],["Label stacking","Deux labels empilés : un pour traverser le backbone, un pour identifier le VPN."]],
st:[["SP1(config)#","ip vrf Client_A","Créer la VRF du client."],["SP1(config-vrf)#","rd 100:1","Route Distinguisher."],["SP1(config-vrf)#","route-target both 1:100","Importer et exporter avec la RT 1:100."],["SP1(config)#","interface s1/1","Interface qui fait face au CE."],["SP1(config-if)#","ip vrf forwarding Client_A","Associer l'interface à la VRF : son adresse IP est supprimée."],["SP1(config-if)#","ip address 192.168.12.1 255.255.255.0","Ressaisir l'adresse."],["SP1#","ping vrf Client_A 192.168.12.2","Le ping doit préciser la VRF."],["SP1(config)#","router bgp 1","BGP de l'opérateur, AS 1."],["SP1(config-router)#","neighbor 3.3.3.3 remote-as 1","Voisin SP3 par sa loopback."],["SP1(config-router)#","neighbor 3.3.3.3 update-source Loopback0","Source de la session : la loopback."],["SP1(config-router)#","address-family vpnv4","Famille d'adresses VPNv4."],["SP1(config-router-af)#","neighbor 3.3.3.3 activate","Activer le voisin pour VPNv4."],["SP1(config-router-af)#","neighbor 3.3.3.3 send-community both","Transmettre les communautés, dont la RT."],["SP3#","show ip route vrf Client_A","Des routes B vers les réseaux du SIEGE apparaissent."]],

function viewHome(){const last=TPS.find(t=>t.id===S.last)||TPS[0];
$("#view").innerHTML=`<section class="hero"><div><p class="mono accent">Atelier Technologies WAN · RSI3 · ISET Nabeul</p><h1>Dix TP WAN à comprendre, observer, puis refaire soi-même.</h1><p class="lead">Du backbone MPLS au Frame Relay : le cours, la démonstration, la console, le quiz et sa correction, réunis dans chaque fiche de TP.</p><div class="row"><a class="btn pri" href="#tp-${last.id}">${S.last?"Reprendre":"Commencer"} : ${esc(last.code)}</a><a class="btn" href="#tps">Voir les 10 TP</a></div><p class="muted small">Réalisé par Lina Ben Alaya, classe RSI31.</p></div>
<div class="card map"><div class="mapgrid">${Object.entries(THEMES).map(([k,v])=>`<a href="#modules" class="zone" style="--tc:var(--c-${k})"><strong>${esc(v.n)}</strong><span class="small">${TPS.filter(t=>t.th===k).map(t=>esc(t.code)).join(" · ")}</span></a>`).join("")}</div><p class="muted small">Chaque zone ouvre un thème.</p></div></section>
<section class="stats"><div class="card"><b>10</b><span>travaux pratiques</span></div><div class="card"><b>5</b><span>thèmes</span></div><div class="card"><b>5</b><span>modes par TP</span></div><div class="card"><b>${Object.keys(SIMS).length}</b><span>simulateurs calculés</span></div></section>
<h2>Cinq modes dans chaque TP</h2><div class="grid5">${[["Apprendre","Le cours, les définitions, la topologie."],["Observer","La manipulation rejouée pas à pas."],["Pratiquer","Les commandes à taper, puis un simulateur."],["Évaluer","Un quiz noté, sans aide."],["Corriger","La bonne réponse et l'explication de chaque erreur."]].map((m,i)=>`<div class="card"><span class="mono accent">0${i+1}</span><strong>${m[0]}</strong><span class="muted small">${m[1]}</span></div>`).join("")}</div>

v.innerHTML=`<p class="crumb small"><a href="#modules">Modules</a> / ${esc(THEMES[t.th].n)} / <span>${esc(t.code)}</span></p><div class="tphead" style="--tc:var(--c-${t.th})"><div><p class="mono" style="color:var(--tc)">${esc(THEMES[t.th].n)} · ${esc(t.tool)} · ${t.dur} min</p><h1>${esc(t.code)} – ${esc(t.t)}</h1></div></div><div class="tabs" role="tablist" aria-label="Modes du TP">${MODES.map((m,i)=>`<button role="tab" data-m="${m[0]}">${i+1} · ${m[1]}<span class="tick" aria-hidden="true"></span></button>`).join("")}</div><div id="pane" role="tabpanel"></div>`;

paint()}

function mLearn(t,el,paint){el.innerHTML=`<div class="two"><div><h2>Objectifs</h2><ul>${t.obj.map(o=>`<li>${esc(o)}</li>`).join("")}</ul><h2>Notions</h2><dl class="defs">${t.no.map(n=>`<dt>${esc(n[0])}</dt><dd>${esc(n[1])}</dd>`).join("")}</dl></div><aside class="card"><h2>Topologie et adressage</h2><ul class="mono small">${t.topo.map(o=>`<li>${esc(o)}</li>`).join("")}</ul><p class="muted small">Outil : ${esc(t.tool)}. Le schéma d'origine figure dans l'énoncé.</p></aside></div><button class="btn pri" id="ok">${done(t.id,"a")?"Cours lu ✓":"J'ai lu le cours"}</button>`;$("#ok").onclick=()=>{P(t.id).a=true;save();tpMode="o";paint()}}

function mWatch(t,el,paint){el.innerHTML=`<div class="card pad0"><div class="cardh"><h2>Démonstration pas à pas</h2>${badge("demo")}</div><div class="pad"><p id="wnote" class="note" aria-live="polite">Appuyez sur Lecture : les commandes de l'énoncé sont rejouées une par une.</p><pre class="term" id="wterm" aria-label="Console rejouée"></pre><div class="row"><button class="btn pri" id="play">Lecture</button><button class="btn" id="next">Étape suivante</button><button class="btn" id="reset">Recommencer</button><span class="muted small" id="wpos"></span></div><p class="muted small">Démonstration reconstituée à partir de l'énoncé. L'export HTML5 ActivePresenter de la manipulation réelle prendra place ici.</p></div></div>`;
let i=0,tm=null;const term=$("#wterm");
const step=()=>{if(i>=t.st.length){stop();P(t.id).o=true;save();$("#wnote").textContent="Démonstration terminée. Passez au mode Pratiquer.";paint&&document.querySelectorAll(".tabs button").forEach(b=>b.querySelector(".tick").textContent=done(t.id,b.dataset.m)?" ✓":"");return}const s=t.st[i++];term.textContent+=s[0]+s[1]+"\n";term.scrollTop=term.scrollHeight;$("#wnote").textContent=s[2];$("#wpos").textContent=i+" / "+t.st.length};
const stop=()=>{clearInterval(tm);tm=null;$("#play").textContent="Lecture"};
$("#play").onclick=()=>{if(tm)return stop();$("#play").textContent="Pause";step();tm=setInterval(step,2200);timers.push(tm)};
$("#next").onclick=()=>{stop();step()};$("#reset").onclick=()=>{stop();i=0;term.textContent="";$("#wpos").textContent="";$("#wnote").textContent="Appuyez sur Lecture."}}

function cmdOk(inp,exp){const a=inp.trim().toLowerCase().split(/\s+/),b=exp.toLowerCase().split(/\s+/);if(a.length!==b.length)return false;return a.every((x,k)=>x===b[k]||(!/[\d.:@\/]/.test(b[k])&&x.length>=2&&b[k].startsWith(x)))}
function mPractice(t,el){let i=0,first=0,tries=0;
el.innerHTML=`<div class="two wide"><aside class="card"><h2>Chronologie</h2><ol class="chrono" id="chrono">${t.st.map((s,k)=>`<li data-k="${k}">${esc(s[2])}</li>`).join("")}</ol></aside><div><div class="card pad0"><div class="cardh"><h2>Console</h2>${badge("guide")}</div><div class="pad"><p class="note" id="task" aria-live="polite"></p><pre class="term" id="pterm"></pre><form id="pf" class="row"><label class="grow"><span class="mono" id="prompt"></span><input id="pin" class="mono" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Tapez la commande puis Entrée"></label><button class="btn pri">Valider</button><button type="button" class="btn" id="hint">Indice</button></form><p id="fb" class="small" aria-live="polite"></p><p class="muted small">Les abréviations IOS sont acceptées (int, sh…). Aucun routeur n'est interrogé.</p></div></div><div id="simslot"></div></div></div>`;
const show=()=>{document.querySelectorAll("#chrono li").forEach(li=>li.className=li.dataset.k<i?"d":li.dataset.k==i?"cur":"");if(i>=t.st.length){$("#task").textContent=`Terminé : ${first} commandes sur ${t.st.length} réussies du premier coup.`;$("#prompt").textContent="";$("#pin").disabled=true;P(t.id).p={done:true,score:first,total:t.st.length};save();document.querySelectorAll(".tabs button").forEach(b=>b.querySelector(".tick").textContent=done(t.id,b.dataset.m)?" ✓":"");return}$("#task").textContent=`Étape ${i+1} sur ${t.st.length} : ${t.st[i][2]}`;$("#prompt").textContent=t.st[i][0];tries=0};
$("#pf").onsubmit=e=>{e.preventDefault();if(i>=t.st.length)return;const val=$("#pin").value;if(!val.trim())return;const s=t.st[i];if(cmdOk(val,s[1])){$("#pterm").textContent+=s[0]+s[1]+"\n";$("#pterm").scrollTop=1e6;if(tries===0)first++;$("#fb").textContent="Correct.";$("#fb").className="small good";i++;$("#pin").value="";show()}else{tries++;$("#fb").className="small bad";$("#fb").textContent=tries>=2?"Commande attendue : "+s[1]:"Ce n'est pas la commande attendue. Relisez la consigne ou demandez un indice."}};
$("#hint").onclick=()=>{if(i<t.st.length){tries=Math.max(tries,1);const w=t.st[i][1].split(" ");$("#fb").className="small";$("#fb").textContent="Indice : la commande commence par « "+w.slice(0,Math.min(2,w.length-1)||1).join(" ")+" »."}};
show();if(t.sim)renderSim(t.sim,$("#simslot"))}

function mEval(t,el,paint){const ans=new Array(t.qz.length).fill(null);
el.innerHTML=`<form id="qf"><p class="note">Répondez aux ${t.qz.length} questions sans aide. La correction détaillée se trouve dans le mode Corriger.</p>${t.qz.map((q,k)=>`<fieldset class="card q"><legend>${k+1}. ${esc(q[0])}</legend>${shuf(4).map(j=>`<label class="opt"><input type="radio" name="q${k}" value="${j}"> ${esc(q[1][j])}</label>`).join("")}</fieldset>`).join("")}<button class="btn pri">Valider mes réponses</button><p id="qfb" class="small bad" aria-live="polite"></p></form>`;
$("#qf").onsubmit=e=>{e.preventDefault();t.qz.forEach((q,k)=>{const c=el.querySelector(`input[name=q${k}]:checked`);ans[k]=c?+c.value:null});if(ans.includes(null)){$("#qfb").textContent="Répondez à toutes les questions avant de valider.";return}const sc=ans.filter((a,k)=>a===t.qz[k][2]).length;P(t.id).e={done:true,score:sc,total:t.qz.length,ans};save();tpMode="c";paint()}}

function mFix(t,el){const e=P(t.id).e;if(!e){el.innerHTML='<p class="note">Faites d\'abord le mode Évaluer : la correction s\'appuie sur vos réponses.</p>';return}P(t.id).c=true;save();document.querySelectorAll(".tabs button").forEach(b=>b.querySelector(".tick").textContent=done(t.id,b.dataset.m)?" ✓":"");
el.innerHTML=`<div class="card score"><b>${e.score} / ${e.total}</b><span>${e.score===e.total?"Tout est juste.":"Relisez les explications des questions manquées."}</span></div>${t.qz.map((q,k)=>{const ok=e.ans[k]===q[2];return `<div class="card q"><p><strong>${k+1}. ${esc(q[0])}</strong></p><p class="${ok?"good":"bad"}">${ok?"Juste":"Faux"} – votre réponse : ${esc(q[1][e.ans[k]])}</p>${ok?"":`<p>Réponse attendue : <strong>${esc(q[1][q[2]])}</strong></p>`}<p class="muted">${esc(q[3])}</p></div>`}).join("")}<p class="muted small">Corrections rédigées à partir des énoncés ; à faire relire par l'enseignant.</p>`}

/* Simulateurs calculés */
function renderSim(k,el){const box=document.createElement("div");box.className="card pad0 sim";box.innerHTML=`<div class="cardh"><h2>Simulateur : ${SIMS[k]}</h2>${badge("calc")}</div><div class="pad"></div>`;el.appendChild(box);({nat:simNat,labels:simLabels,da:simDa,encap:simEncap,fr:simFr})[k](box.querySelector(".pad"))}
const seg=(name,opts,val)=>`<fieldset class="seg"><legend>${name.slice(0,-5)}</legend>${opts.map(o=>`<label><input type="radio" name="${name}" value="${o[0]}" ${o[0]===val?"checked":""}><span>${o[1]}</span></label>`).join("")}</fieldset>`;
const table=(h,rows)=>`<div class="scroll"><table><thead><tr>${h.map(x=>`<th scope="col">${x}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
function simNat(el){const uid="n"+Math.random().toString(36).slice(2,6);el.innerHTML=`<div class="row">${seg("Mode"+uid,[["s","Statique"],["p","Pool dynamique"],["o","Surcharge (PAT)"]],"p")}<label>Hôtes internes qui sortent<input type="number" min="1" max="12" value="7" class="num"></label></div><div class="out" aria-live="polite"></div><p class="muted small">Modèle simplifié du TP3 : pool 209.165.200.241 à .246, interface S0/1/0 de R2 en 209.165.200.225. Les numéros de port sont des exemples.</p>`;
const nets=["192.168.10.","192.168.11.","192.168.30."];const calc=()=>{const m=el.querySelector("input[type=radio]:checked").value,n=Math.min(12,Math.max(1,+el.querySelector(".num").value||1));let rows=[],msg="";
if(m==="s"){rows=[["Serveur web","192.168.20.2","77.77.77.77",'<span class="good">mappage permanent</span>']];msg="Le NAT statique ne concerne que le serveur web : il reste joignable depuis l'extérieur sur 77.77.77.77, quel que soit le nombre d'hôtes."}
else for(let i=0;i<n;i++){const loc=nets[i%3]+(2+Math.floor(i/3));if(m==="p"){rows.push(["Hôte "+(i+1),loc,i<6?"209.165.200."+(241+i):"aucune adresse libre",i<6?'<span class="good">traduit</span>':'<span class="bad">non traduit – pool épuisé</span>'])}else rows.push(["Hôte "+(i+1),loc+":"+(1025+i),"209.165.200.225:"+(1025+i),'<span class="good">traduit</span>'])}
if(m==="p")msg=n>6?`Le pool ne contient que six adresses : ${n-6} hôte(s) ne peuvent pas sortir. Passez en surcharge pour comparer.`:"Chaque hôte reçoit une adresse du pool. Au-delà de six hôtes, le pool est épuisé.";if(m==="o")msg="Tous les hôtes partagent l'adresse de l'interface S0/1/0 ; le numéro de port distingue les traductions.";
el.querySelector(".out").innerHTML=table(["Hôte","Adresse locale interne","Adresse globale interne","État"],rows)+`<p class="note">${msg}</p>`};el.oninput=calc;calc()}
function simLabels(el){const uid="l"+Math.random().toString(36).slice(2,6);el.innerHTML=`<div class="row">${seg("Service"+uid,[["v","VPN MPLS (TP2)"],["b","Backbone seul (TP1)"]],"v")}${seg("Sens"+uid,[["sa","Siège → Agence"],["as","Agence → Siège"]],"sa")}</div><div class="out" aria-live="polite"></div><p class="muted small">Modèle simplifié : les numéros de labels sont des exemples, vos routeurs en attribueront d'autres. SP2 retire le label de transport (avant-dernier saut).</p>`;
const calc=()=>{const [svc,dir]=[...el.querySelectorAll("input:checked")].map(i=>i.value);const sa=dir==="sa",vpn=svc==="v";const pe1=sa?"SP1":"SP3",pe2=sa?"SP3":"SP1",ce1=sa?"SIEGE":"AGENCE",ce2=sa?"AGENCE":"SIEGE",lt=sa?17:18,lv=sa?22:23;const lab=a=>a.length?a.map(x=>`<span class="lbl">${x}</span>`).join(" "):"aucun (IP pur)";
const rows=vpn?[[ce1+" → "+pe1,lab([]),"Paquet IP du client, reçu dans la VRF Client_A"],[pe1+" → SP2",lab(["transport "+lt,"VPN "+lv]),pe1+" pose deux labels (label stacking)"],["SP2 → "+pe2,lab(["VPN "+lv]),"SP2 retire le label de transport"],[pe2+" → "+ce2,lab([]),pe2+" retire le label VPN et route dans la VRF"]]:[[pe1+" → SP2",lab(["transport "+lt]),pe1+" pose le label du préfixe de la loopback de "+pe2],["SP2 → "+pe2,lab([]),"SP2 retire le label : avant-dernier saut"]];
el.querySelector(".out").innerHTML=table(["Lien","Labels sur le paquet","Opération"],rows)};el.oninput=calc;calc()}
function simDa(el){el.innerHTML=`<div class="row"><label>Distance des routes EIGRP externes sur R3<input type="number" class="num" min="1" max="255" value="170"></label></div><div class="out" aria-live="polite"></div><p class="muted small">Modèle du TP Redistribution : R3 apprend 172.16.10.0/24 par OSPF (distance 110) et par EIGRP externe. La distance la plus faible gagne. La commande du TP est « distance eigrp 90 105 ».</p>`;
const calc=()=>{const d=Math.min(255,Math.max(1,+el.querySelector(".num").value||170));const win=d<110?"e":d>110?"o":"=";el.querySelector(".out").innerHTML=table(["Source","Prochain saut","Distance","Retenue"],[["OSPF (route externe)","R1",110,win==="o"?'<span class="good">oui</span>':"non"],["EIGRP externe","domaine EIGRP, vers R5",d,win==="e"?'<span class="good">oui</span>':"non"]])+`<p class="note">${win==="o"?"R3 passe par R1 et traverse trois domaines de routage : c'est le mauvais choix constaté dans le TP.":win==="e"?"R3 passe par le domaine EIGRP : deux domaines traversés au lieu de trois.":"Distances égales : cas hors du TP, choisissez une valeur différente de 110."}</p>`};el.oninput=calc;calc()}
function simEncap(el){const uid="e"+Math.random().toString(36).slice(2,6);el.innerHTML=`<div class="row">${seg("Tunnel"+uid,[["g","GRE seul"],["i","IPsec seul (TP5)"],["gi","GRE dans IPsec (TP5 bis)"]],"gi")}</div><div class="out" aria-live="polite"></div><p class="muted small">Modèle simplifié, de l'extérieur vers l'intérieur du paquet. Adresses du TP5 bis pour GRE, du TP5 pour IPsec seul.</p>`;
const calc=()=>{const m=el.querySelector("input:checked").value;const H=(n,d,c)=>`<div class="hdr ${c||""}"><strong>${n}</strong><span class="small">${d}</span></div>`;let h="",msg="";
if(m==="g"){h=H("IP externe","201.20.20.1 → 204.20.20.2")+H("GRE","protocole 47")+H("IP d'origine","10.0.10.1 → 10.0.20.1")+H("ICMP","ping");msg="Tout est lisible dans Wireshark : on voit les deux en-têtes IP."}
if(m==="i"){h=H("IP externe","10.1.1.2 → 10.2.2.2")+H("ESP","en-tête IPsec")+H("IP d'origine","192.168.1.3 → 192.168.3.3","enc")+H("ICMP","ping","enc");msg="Dans la capture, seuls l'en-tête IP externe et ESP sont lisibles ; le reste est chiffré."}
if(m==="gi"){h=H("IP externe","201.20.20.1 → 204.20.20.2")+H("ESP","en-tête IPsec")+H("IP du tunnel GRE","201.20.20.1 → 204.20.20.2","enc")+H("GRE","protocole 47","enc")+H("IP d'origine","10.0.10.1 → 10.0.20.1","enc")+H("ICMP","ping","enc");msg="GRE encapsule d'abord, IPsec chiffre ensuite : le paquet GRE entier devient illisible."}
el.querySelector(".out").innerHTML=`<div class="stack">${h}</div><p class="small"><span class="hdr enc inl">chiffré</span> = illisible dans une capture</p><p class="note">${msg}</p>`};el.oninput=calc;calc()}
function simFr(el){const uid="f"+Math.random().toString(36).slice(2,6);el.innerHTML=`<div class="row">${seg("SiteCentral"+uid,[["m","Interface physique multipoint"],["s","Sous-interfaces point à point"]],"m")}${seg("PVC Agence1"+uid,[["up","Actif"],["down","En panne"]],"down")}</div><div class="out" aria-live="polite"></div><p class="muted small">Modèle du TP6 bis : route principale vers 192.168.2.0/24 par Frame Relay, route de secours par le lien PPP 172.16.1.0/24.</p>`;
const calc=()=>{const [m,p]=[...el.querySelectorAll("input:checked")].map(i=>i.value);const sub=m==="s",dn=p==="down";const ifUp=!(sub&&dn);const viaFr=ifUp;const ok=!dn||!viaFr;
el.querySelector(".out").innerHTML=table(["Élément","État"],[[sub?"Sous-interface s0/1.16":"Interface s0/1",ifUp?'<span class="good">active</span>':'<span class="bad">inactive</span>'],["Route utilisée vers 192.168.2.0/24",viaFr?"Frame Relay (route principale)":"lien PPP (route de secours)"],["Ping de C2 vers C1",ok?'<span class="good">réussit</span>':'<span class="bad">échoue</span>']])+`<p class="note">${!dn?"Tout fonctionne : la route par Frame Relay est préférée.":sub?"La sous-interface suit l'état de son PVC : elle tombe, la route principale disparaît et le secours prend le relais.":"L'interface physique reste active car elle porte aussi le PVC d'Agence2 : la route principale reste en place et les paquets sont perdus."}</p>`};el.oninput=calc;calc()}

function viewSims(){$("#view").innerHTML=`<h1>Simulations</h1><p class="lead">Trois niveaux, toujours étiquetés.</p><div class="grid3"><div class="card">${badge("demo")}<span class="small">Mode Observer de chaque TP.</span></div><div class="card">${badge("guide")}<span class="small">Mode Pratiquer de chaque TP : ${TPS.reduce((n,t)=>n+t.st.length,0)} commandes à taper.</span></div><div class="card">${badge("calc")}<span class="small">Les ${Object.keys(SIMS).length} simulateurs ci-dessous.</span></div></div><div id="sims"></div>`;Object.keys(SIMS).forEach(k=>{const w=document.createElement("div");w.innerHTML=`<p class="muted small simtp">TP concernés : ${TPS.filter(t=>t.sim===k||(k==="labels"&&t.id==="tp1b")).map(t=>`<a href="#tp-${t.id}">${esc(t.code)}</a>`).join(", ")}</p>`;$("#sims").appendChild(w);renderSim(k,w)})}

function viewQuiz(){const v=$("#view");v.innerHTML=`<h1>Quiz</h1><div class="two"><div><h2>Quiz par TP</h2><div class="scroll"><table><thead><tr><th scope="col">TP</th><th scope="col">Score</th><th scope="col"></th></tr></thead><tbody>${TPS.map(t=>{const e=P(t.id).e;return `<tr><td>${esc(t.code)} – ${esc(t.t)}</td><td>${e?e.score+" / "+e.total:"–"}</td><td><a href="#tp-${t.id}" data-go="${t.id}">${e?"Refaire":"Commencer"}</a></td></tr>`}).join("")}</tbody></table></div></div><aside class="card"><h2>Mode défi</h2><p class="small">Dix questions tirées au hasard dans tous les TP, trois minutes, correction instantanée.</p><p class="small muted">Meilleur score : ${S.best!=null?S.best+" / 10":"aucun"}</p><button class="btn pri" id="go">Lancer le défi</button></aside></div><div id="defi"></div>`;
v.querySelectorAll("[data-go]").forEach(a=>a.onclick=()=>{tpMode="e"});
$("#go").onclick=()=>{const all=TPS.flatMap(t=>t.qz.map(q=>[t.code,q]));for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]]}const qs=all.slice(0,10);let k=0,sc=0,left=180;const d=$("#defi");
const end=()=>{clearTimers();if(S.best==null||sc>S.best){S.best=sc;save()}d.innerHTML=`<div class="card score"><b>${sc} / 10</b><span>Défi terminé.</span></div>`};
const ask=()=>{if(k>=10)return end();const [code,q]=qs[k];d.innerHTML=`<div class="card q"><p class="row"><span class="mono accent">Question ${k+1} / 10 · ${esc(code)}</span><span class="mono" id="clock"></span></p><p><strong>${esc(q[0])}</strong></p>${shuf(4).map(j=>`<button class="btn opt" data-j="${j}">${esc(q[1][j])}</button>`).join("")}<p id="dfb" aria-live="polite"></p></div>`;tick();d.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{const ok=+b.dataset.j===q[2];if(ok)sc++;d.querySelectorAll("[data-j]").forEach(x=>{x.disabled=true;if(+x.dataset.j===q[2])x.classList.add("right")});if(!ok)b.classList.add("wrong");$("#dfb").innerHTML=`<span class="${ok?"good":"bad"}">${ok?"Juste.":"Faux."}</span> ${esc(q[3])} <button class="btn pri" id="nx">${k<9?"Question suivante":"Voir le score"}</button>`;$("#nx").onclick=()=>{k++;ask()};$("#nx").focus()})};
const tick=()=>{const c=$("#clock");if(c)c.textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0")};clearTimers();timers.push(setInterval(()=>{left--;tick();if(left<=0)end()},1000));ask();d.scrollIntoView({behavior:"smooth"})}}

function viewDash(){const n=countDone(),full=TPS.filter(t=>MODES.every(m=>done(t.id,m[0]))).length;const ev=TPS.map(t=>P(t.id).e).filter(Boolean);const avg=ev.length?Math.round(100*ev.reduce((a,e)=>a+e.score/e.total,0)/ev.length)+" %":"–";
let nx=null;for(const t of TPS){const m=MODES.find(m=>!done(t.id,m[0]));if(m){nx=[t,m];break}}
$("#view").innerHTML=`<h1>Tableau de bord</h1><p class="lead">Votre avancement, enregistré dans ce navigateur uniquement.</p><section class="stats"><div class="card"><b>${n} / 50</b><span>activités terminées</span></div><div class="card"><b>${full} / 10</b><span>TP entièrement validés</span></div><div class="card"><b>${avg}</b><span>score moyen aux quiz</span></div><div class="card hl">${nx?`<span class="small accent">Activité conseillée</span><strong>${esc(nx[0].code)} · ${nx[1][1]}</strong><a class="btn pri" href="#tp-${nx[0].id}" id="nxb">Y aller</a>`:"<strong>Parcours terminé.</strong>"}</div></section>
<div class="card pad0"><div class="cardh"><h2>Avancement par TP et par mode</h2><button class="btn" id="rz">Réinitialiser</button></div><div class="scroll"><table class="dash"><thead><tr><th scope="col">Travail pratique</th>${MODES.map(m=>`<th scope="col">${m[1]}</th>`).join("")}</tr></thead><tbody>${TPS.map(t=>`<tr><th scope="row"><a href="#tp-${t.id}"><span class="dot" style="--tc:var(--c-${t.th})"></span>${esc(t.code)}</a></th>${MODES.map(m=>{const x=P(t.id)[m[0]];const d=done(t.id,m[0]);return `<td><span class="cell ${d?"f":""}">${d?(x.total?x.score+" / "+x.total:"fait"):"à faire"}</span></td>`}).join("")}</tr>`).join("")}</tbody></table></div></div><p id="rzc" class="small" aria-live="polite"></p>`;
if(nx)$("#nxb").onclick=()=>{tpMode=nx[1][0]};let arm=false;$("#rz").onclick=()=>{if(!arm){arm=true;$("#rz").textContent="Confirmer la réinitialisation";$("#rzc").textContent="Cliquez de nouveau pour effacer toute la progression.";return}S.p={};S.best=null;S.last=null;save();viewDash()}}

function viewRes(){const g={};TPS.forEach(t=>t.no.forEach(n=>{g[n[0]]=g[n[0]]||[n[1],[]];g[n[0]][1].push(t)}));const keys=Object.keys(g).sort((a,b)=>a.localeCompare(b,"fr"));
$("#view").innerHTML=`<h1>Ressources</h1><div class="two"><div><h2>Glossaire</h2><label>Filtrer le glossaire<input id="gq" type="search" placeholder="ex. VRF, DLCI"></label><dl class="defs" id="gl"></dl></div><aside class="card"><h2>Documents</h2><p class="small">Énoncés à l'origine de chaque fiche :</p><ul class="small">${TPS.map(t=>`<li>${esc(t.code)} – ${esc(t.t)}</li>`).join("")}</ul><p class="muted small">Les comptes rendus PDF et les projets ActivePresenter (.approj) seront ajoutés ici quand ils seront fournis.</p></aside></div>`;
const upd=()=>{const q=$("#gq").value.toLowerCase();$("#gl").innerHTML=keys.filter(k=>!q||(k+g[k][0]).toLowerCase().includes(q)).map(k=>`<dt>${esc(k)}</dt><dd>${esc(g[k][0])} <span class="small muted">${g[k][1].map(t=>`<a href="#tp-${t.id}">${esc(t.code)}</a>`).join(", ")}</span></dd>`).join("")||"<p class='muted'>Aucun terme.</p>"};$("#gq").oninput=upd;upd()}

function viewAbout(){$("#view").innerHTML=`<h1>À propos</h1><div class="two"><div><p class="lead">IT LAB transforme les dix TP de l'Atelier Technologies WAN en parcours d'apprentissage : apprendre, observer, pratiquer, évaluer, corriger.</p><dl class="defs"><dt>Auteure</dt><dd>Lina Ben Alaya</dd><dt>Classe</dt><dd>RSI31 – Réseaux et Systèmes Informatiques</dd><dt>Établissement</dt><dd>ISET Nabeul</dd><dt>Matière</dt><dd>Atelier Technologies WAN</dd></dl><h2>Ce qui est simulé et ce qui ne l'est pas</h2><ul><li>Aucune commande n'est exécutée sur un routeur réel.</li><li>La console compare la saisie à la commande de l'énoncé.</li><li>Les simulateurs calculés sont des modèles simplifiés, dont les hypothèses sont affichées.</li><li>Les démonstrations sont reconstituées à partir des énoncés, en attendant les exports ActivePresenter.</li><li>Les corrections des quiz sont à faire relire par l'enseignant.</li></ul></div><aside class="card"><h2>Outils des TP</h2><ul class="small"><li>GNS3, routeurs Cisco 7200</li><li>Cisco Packet Tracer</li><li>Wireshark</li><li>VPCS</li><li>ActivePresenter (Atomi Systems) pour les démonstrations</li></ul></aside></div>`}

$("#themeBtn").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
$("#gsearch").onsubmit=e=>{e.preventDefault();S.q=$("#gs").value;$("#gs").value="";if(location.hash==="#tps")viewLib();else location.hash="#tps"};
setTheme(S.theme||"dark");window.addEventListener("hashchange",route);route();

</script>
</body>
